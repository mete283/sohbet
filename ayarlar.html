<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ayarlar · Lumea</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --text: #1c1c1e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.06);
      --muted: #8e8e93;
      --active-bg: rgba(0, 0, 0, 0.04);
      --back-btn-bg: #ffffff;
      --accent: #007aff;
      --danger: #ff3b30;
      --danger-bg: rgba(255, 59, 48, 0.1);
      --toggle-off: #e9e9ea;
      --modal-bg: rgba(255, 255, 255, 0.94);
    }
    [data-theme="dark"] {
      --bg: #0d0d10;
      --text: #f2f2f7;
      --card-bg: rgba(28, 28, 34, 0.75);
      --border: rgba(255, 255, 255, 0.07);
      --muted: #8e8e93;
      --active-bg: rgba(255, 255, 255, 0.06);
      --back-btn-bg: #2c2c32;
      --accent: #0a84ff;
      --danger: #ff453a;
      --danger-bg: rgba(255, 69, 58, 0.16);
      --toggle-off: #39393d;
      --modal-bg: rgba(28, 28, 34, 0.96);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none;
      user-select: none;
      outline: none !important;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    svg {
      -webkit-user-drag: none;
      pointer-events: none;
      flex-shrink: 0;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 18px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -16px 0 2px;
      padding: 16px 0 10px;
      background: var(--bg);
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--back-btn-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .back-btn:active { transform: scale(0.92); }
    .back-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 2px 0 0 6px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      width: 100%;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.15s ease;
    }
    .row:last-child { border-bottom: none; }
    .row:active { background-color: var(--active-bg); }
    .row-static { cursor: default; }
    .row-static:active { background: transparent; }
    .row-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .row-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .row-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--text);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .row-icon.danger svg {
      stroke: var(--danger);
      opacity: 1;
    }
    .row-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .row-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .row-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .beta {
      display: inline-block;
      background: #000;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }
    body:not([data-theme="dark"]) .beta { border-color: #000; }
    .row-desc {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.3;
    }
    .row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 10px;
    }
    .chevron {
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: var(--active-bg);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--toggle-off);
      transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 28px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
    .row.danger .row-title { color: var(--danger); }
    .info-val {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(320px, 90vw);
      background: var(--modal-bg);
      border-radius: 26px;
      padding: 22px 20px 18px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
      transform: scale(0.92) translateY(8px);
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      background: var(--danger-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .modal-icon-wrap svg {
      width: 22px;
      height: 22px;
      stroke: var(--danger);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 650;
      margin-bottom: 6px;
      color: var(--text);
    }
    .modal-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      height: 42px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .modal-btn:active { transform: scale(0.96); }
    .btn-cancel { background: var(--active-bg); color: var(--text); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="title">Ayarlar</div>
      <div class="back-btn" id="btnBack" aria-label="Geri" role="button">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
      </div>
    </div>
    <div class="card">
      <button type="button" class="row" id="goGizlilik">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><rect x="9" y="10.5" width="6" height="5" rx="1"/><path d="M10 10.5V9a2 2 0 0 1 4 0v1.5"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Gizlilik</span>
            <span class="row-desc">Veri ve gizlilik tercihlerin</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
    </div>

    <div class="card">
      <button type="button" class="row" id="goVeriler">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Veriler</span>
            <span class="row-desc">Verilerini yönet</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
      <button type="button" class="row" id="goAktarim">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Lui veri aktarımı</span>
            <span class="row-desc">Sohbetleri ayarları ve tüm verileri taşı</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
      <button type="button" class="row" id="goDil">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Dil <span class="beta">BETA</span></span>
            <span class="row-desc">Uygulama dilini seç</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
    </div>

    <div class="card">
      <button type="button" class="row" id="goKisisellestirme">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9L11 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Kişiselleştirilebilir Zeka</span>
            <span class="row-desc">Özel talimatlar, model tercihi ve yanıtlar</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
    </div>

    <div class="card">
      <button type="button" class="row" id="goAnimasyonlar">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Animasyonlar</span>
            <span class="row-desc">Açılış ve hareket tercihleri</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
      <button type="button" class="row" id="goSifre">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Giriş şifresi</span>
            <span class="row-desc">4 veya 6 haneli PIN kilidi</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
    </div>

    <div class="card">
      <button type="button" class="row" id="goBubbleColor">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.1 2.5-.3.4-.1.7-.5.7-.9 0-.4-.3-.7-.6-.9-.6-.3-1-.9-1-1.6 0-1.1.9-2 2-2h2.2c2.1 0 3.8-1.7 3.8-3.8C21.6 6.2 17.4 2 12 2z"/>
              <circle cx="7.5" cy="11.5" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="10.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="14.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="17.5" cy="11.5" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Kişiselleştirilebilir Renkler</span>
            <span class="row-desc">Yanıt ve soru kutucuğu renklerini ayarla</span>
          </div>
        </div>
        <div class="row-right">
          <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
        </div>
      </button>
    </div>
    <div class="card">
      <div class="row row-static">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Sürüm</span>
          </div>
        </div>
        <div class="row-right">
          <span class="info-val">1.0.0</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script>
    (function () {
      const THEME_KEY = 'lumea-theme';

      function applyTheme(isDark) {
        if (isDark) document.body.setAttribute('data-theme', 'dark');
        else document.body.removeAttribute('data-theme');
      }
      applyTheme(localStorage.getItem(THEME_KEY) === 'dark');

      var toastMsg = document.getElementById('toastMsg');
      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(function () { toastMsg.classList.remove('show'); }, 2400);
      }

      document.getElementById('btnBack').addEventListener('click', function () {
        window.location.href = 'index.html';
      });
      document.getElementById('goVeriler').addEventListener('click', function () {
        window.location.href = 'veriler.html';
      });
      document.getElementById('goAktarim').addEventListener('click', function () {
        window.location.href = 'aktarim.html';
      });
      document.getElementById('goDil').addEventListener('click', function () {
        window.location.href = 'hata.html';
      });
      document.getElementById('goGizlilik').addEventListener('click', function () {
        window.location.href = 'gizlilik.html';
      });
      document.getElementById('goKisisellestirme').addEventListener('click', function () {
        window.location.href = 'kisisellestirme.html';
      });
      document.getElementById('goBubbleColor').addEventListener('click', function () {
        window.location.href = 'renk.html';
      });
      document.getElementById('goAnimasyonlar').addEventListener('click', function () {
        window.location.href = 'animasyonlar.html';
      });
      document.getElementById('goSifre').addEventListener('click', function () {
        window.location.href = 'sifreayarlama.html';
      });
    })();
  </script>
</body>
</html>
