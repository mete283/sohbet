<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Giriş şifresi · Lumea</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --text: #1c1c1e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.06);
      --muted: #8e8e93;
      --active-bg: rgba(0, 0, 0, 0.04);
      --back-btn-bg: #ffffff;
      --accent: #007aff;
      --danger: #ff3b30;
      --danger-bg: rgba(255, 59, 48, 0.12);
      --toggle-off: #e9e9ea;
      --input-bg: rgba(0, 0, 0, 0.04);
    }
    [data-theme="dark"] {
      --bg: #0d0d10;
      --text: #f2f2f7;
      --card-bg: rgba(28, 28, 34, 0.75);
      --border: rgba(255, 255, 255, 0.07);
      --muted: #8e8e93;
      --active-bg: rgba(255, 255, 255, 0.06);
      --back-btn-bg: #2c2c32;
      --accent: #0a84ff;
      --danger: #ff453a;
      --danger-bg: rgba(255, 69, 58, 0.18);
      --toggle-off: #39393d;
      --input-bg: rgba(255, 255, 255, 0.06);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 18px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -16px 0 2px;
      padding: 16px 0 10px;
      background: var(--bg);
    }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--back-btn-bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none;
    }
    .back-btn:active { transform: scale(0.92); }
    .back-btn svg {
      width: 18px; height: 18px; stroke: var(--text); fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .section-label {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin: 2px 0 0 6px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .row-title { font-size: 15px; font-weight: 600; }
    .row-desc { font-size: 12px; color: var(--muted); }
    .switch {
      position: relative; display: inline-block; width: 48px; height: 28px; flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--toggle-off); transition: 0.25s; border-radius: 28px;
    }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
      transition: 0.25s; box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
    .pin-len {
      display: flex; gap: 8px;
    }
    .chip {
      flex: 1; height: 40px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: rgba(0, 122, 255, 0.14);
      border-color: rgba(0, 122, 255, 0.4);
      color: var(--accent);
    }
    [data-theme="dark"] .chip.active {
      background: rgba(10, 132, 255, 0.2);
      border-color: rgba(10, 132, 255, 0.45);
      color: #0a84ff;
    }
    .pin-input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-align: center;
      -webkit-user-select: text;
      user-select: text;
    }
    .pin-input::placeholder {
      letter-spacing: 0.1em;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    .btn-save {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:active { transform: scale(0.97); }
    .btn-remove {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .btn-remove.show { display: block; }
    .status {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .status.on { color: var(--accent); font-weight: 600; }
    .note {
      font-size: 12px; color: var(--muted); line-height: 1.45; padding: 0 6px;
    }
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--text); color: var(--bg);
      padding: 10px 18px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: all 0.28s; z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #pinPanel { display: none; }
    #pinPanel.show { display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="title">Giriş şifresi</div>
      <a href="ayarlar.html" class="back-btn" aria-label="Geri">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
      </a>
    </div>

    <div class="section-label">Koruma</div>
    <div class="card">
      <div class="row">
        <div>
          <div class="row-title">PIN ile kilitle</div>
          <div class="row-desc" id="enableDesc">Kapalı</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="enablePin">
          <span class="slider"></span>
        </label>
      </div>
      <div class="status" id="statusText">Şifre ayarlanmamış</div>
    </div>

    <div class="section-label" id="setupLabel" style="display:none">PIN ayarla</div>
    <div class="card" id="pinPanel">
      <div class="pin-len">
        <button type="button" class="chip active" data-len="4">4 hane</button>
        <button type="button" class="chip" data-len="6">6 hane</button>
      </div>
      <input type="password" class="pin-input" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN gir" autocomplete="off">
      <input type="password" class="pin-input" id="pinConfirm" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Tekrar gir" autocomplete="off">
      <button type="button" class="btn-save" id="btnSave">Kaydet</button>
      <button type="button" class="btn-remove" id="btnRemove">Şifreyi kaldır</button>
    </div>

    <p class="note">PIN yalnızca bu cihazda saklanır.</p>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      if (localStorage.getItem('lumea-theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
      }

      var ENABLED = 'lumea-pin-enabled';
      var HASH = 'lumea-pin-hash';
      var LEN = 'lumea-pin-len';

      var enablePin = document.getElementById('enablePin');
      var enableDesc = document.getElementById('enableDesc');
      var statusText = document.getElementById('statusText');
      var pinPanel = document.getElementById('pinPanel');
      var setupLabel = document.getElementById('setupLabel');
      var pinInput = document.getElementById('pinInput');
      var pinConfirm = document.getElementById('pinConfirm');
      var btnSave = document.getElementById('btnSave');
      var btnRemove = document.getElementById('btnRemove');
      var toast = document.getElementById('toast');
      var chips = document.querySelectorAll('.chip');
      var pinLen = parseInt(localStorage.getItem(LEN) || '4', 10);
      if (pinLen !== 6) pinLen = 4;

      function simpleHash(s) {
        var h = 5381;
        for (var i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);
        return 'p' + (h >>> 0).toString(16);
      }

      function showToast(m) {
        toast.textContent = m;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 2000);
      }

      function hasPin() {
        return !!localStorage.getItem(HASH);
      }

      function isEnabled() {
        return localStorage.getItem(ENABLED) === '1' && hasPin();
      }

      function syncLenUI() {
        chips.forEach(function (c) {
          c.classList.toggle('active', parseInt(c.dataset.len, 10) === pinLen);
        });
        pinInput.maxLength = pinLen;
        pinConfirm.maxLength = pinLen;
        pinInput.placeholder = pinLen + ' haneli PIN';
        pinConfirm.placeholder = 'Tekrar gir';
      }

      function syncUI() {
        var en = isEnabled();
        enablePin.checked = en;
        enableDesc.textContent = en ? 'Açık' : 'Kapalı';
        statusText.textContent = hasPin()
          ? (en ? 'Şifre aktif · ' + (localStorage.getItem(LEN) || '4') + ' hane' : 'Şifre kayıtlı ama kapalı')
          : 'Şifre ayarlanmamış';
        statusText.classList.toggle('on', en);
        pinPanel.classList.toggle('show', enablePin.checked || hasPin());
        setupLabel.style.display = pinPanel.classList.contains('show') ? 'block' : 'none';
        btnRemove.classList.toggle('show', hasPin());
        syncLenUI();
      }

      chips.forEach(function (c) {
        c.addEventListener('click', function () {
          pinLen = parseInt(c.dataset.len, 10);
          pinInput.value = '';
          pinConfirm.value = '';
          syncLenUI();
        });
      });

      enablePin.addEventListener('change', function () {
        if (enablePin.checked) {
          if (!hasPin()) {
            pinPanel.classList.add('show');
            setupLabel.style.display = 'block';
            enableDesc.textContent = 'PIN kaydetmen gerekiyor';
            showToast('Önce PIN kaydet');
            return;
          }
          localStorage.setItem(ENABLED, '1');
          showToast('Giriş şifresi açıldı');
        } else {
          localStorage.setItem(ENABLED, '0');
          showToast('Giriş şifresi kapatıldı');
        }
        syncUI();
      });

      function onlyDigits(el) {
        el.addEventListener('input', function () {
          el.value = el.value.replace(/\D/g, '').slice(0, pinLen);
        });
      }
      onlyDigits(pinInput);
      onlyDigits(pinConfirm);

      btnSave.addEventListener('click', function () {
        var a = pinInput.value;
        var b = pinConfirm.value;
        if (a.length !== pinLen) {
          showToast(pinLen + ' haneli PIN gir');
          return;
        }
        if (a !== b) {
          showToast('PIN’ler eşleşmiyor');
          return;
        }
        localStorage.setItem(HASH, simpleHash(a));
        localStorage.setItem(LEN, String(pinLen));
        localStorage.setItem(ENABLED, '1');
        pinInput.value = '';
        pinConfirm.value = '';
        enablePin.checked = true;
        showToast('PIN kaydedildi');
        syncUI();
      });

      btnRemove.addEventListener('click', function () {
        localStorage.removeItem(HASH);
        localStorage.removeItem(LEN);
        localStorage.setItem(ENABLED, '0');
        pinInput.value = '';
        pinConfirm.value = '';
        enablePin.checked = false;
        showToast('Şifre kaldırıldı');
        syncUI();
      });

      syncUI();
    })();
  </script>
</body>
</html>
