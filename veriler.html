<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Veriler · Lumea</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --text: #1c1c1e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.06);
      --muted: #8e8e93;
      --active-bg: rgba(0, 0, 0, 0.04);
      --back-btn-bg: #ffffff;
      --accent: #007aff;
      --danger: #ff3b30;
      --danger-bg: rgba(255, 59, 48, 0.1);
      --toggle-off: #e9e9ea;
      --modal-bg: rgba(255, 255, 255, 0.94);
    }
    [data-theme="dark"] {
      --bg: #0d0d10;
      --text: #f2f2f7;
      --card-bg: rgba(28, 28, 34, 0.75);
      --border: rgba(255, 255, 255, 0.07);
      --muted: #8e8e93;
      --active-bg: rgba(255, 255, 255, 0.06);
      --back-btn-bg: #2c2c32;
      --accent: #0a84ff;
      --danger: #ff453a;
      --danger-bg: rgba(255, 69, 58, 0.16);
      --toggle-off: #39393d;
      --modal-bg: rgba(28, 28, 34, 0.96);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none;
      user-select: none;
      outline: none !important;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    svg {
      -webkit-user-drag: none;
      pointer-events: none;
      flex-shrink: 0;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 18px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -16px 0 2px;
      padding: 16px 0 10px;
      background: var(--bg);
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--back-btn-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .back-btn:active { transform: scale(0.92); }
    .back-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 2px 0 0 6px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      width: 100%;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.15s ease;
    }
    .row:last-child { border-bottom: none; }
    .row:active { background-color: var(--active-bg); }
    .row-static { cursor: default; }
    .row-static:active { background: transparent; }
    .row-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .row-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .row-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--text);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .row-icon.danger svg {
      stroke: var(--danger);
      opacity: 1;
    }
    .row-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .row-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .row-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .beta {
      display: inline-block;
      background: #000;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.28);
    }
    body:not([data-theme="dark"]) .beta { border-color: #000; }
    .row-desc {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.3;
    }
    .row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: 10px;
    }
    .chevron {
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: var(--active-bg);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--toggle-off);
      transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 28px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
    .row.danger .row-title { color: var(--danger); }
    .info-val {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(320px, 90vw);
      background: var(--modal-bg);
      border-radius: 26px;
      padding: 22px 20px 18px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
      transform: scale(0.92) translateY(8px);
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      background: var(--danger-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .modal-icon-wrap svg {
      width: 22px;
      height: 22px;
      stroke: var(--danger);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 650;
      margin-bottom: 6px;
      color: var(--text);
    }
    .modal-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      height: 42px;
      border-radius: 14px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .modal-btn:active { transform: scale(0.96); }
    .btn-cancel { background: var(--active-bg); color: var(--text); }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

</style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="title">Veriler</div>
      <div class="back-btn" id="btnBack" aria-label="Geri" role="button">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
      </div>
    </div>

    <div class="card">
      <div class="row row-static">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Açılan Sohbetler</span>
          </div>
        </div>
        <div class="row-right">
          <span class="badge" id="statChats">0</span>
        </div>
      </div>
      <div class="row row-static">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Gönderilen Mesajlar</span>
          </div>
        </div>
        <div class="row-right">
          <span class="badge" id="statSent">0</span>
        </div>
      </div>
      <div class="row row-static">
        <div class="row-left">
          <div class="row-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Alınan Mesajlar</span>
          </div>
        </div>
        <div class="row-right">
          <span class="badge" id="statReceived">0</span>
        </div>
      </div>
    </div>

    <div class="card">
      <button type="button" class="row danger" id="btnClearChats">
        <div class="row-left">
          <div class="row-icon danger">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Sohbet Verilerini Temizle</span>
            <span class="row-desc">Sohbet geçmişi ve mesaj istatistikleri silinir</span>
          </div>
        </div>
      </button>
      <button type="button" class="row danger" id="btnResetChanges">
        <div class="row-left">
          <div class="row-icon danger">
            <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Değişiklikleri Temizle</span>
            <span class="row-desc">Ayarlar, renkler ve tuşlar ilk haline döner</span>
          </div>
        </div>
      </button>
      <button type="button" class="row danger" id="btnClearCache">
        <div class="row-left">
          <div class="row-icon danger">
            <svg viewBox="0 0 24 24"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Önbelleği Temizle</span>
            <span class="row-desc">Geçici dosyalar silinir, sohbetlerin korunur</span>
          </div>
        </div>
      </button>
      <button type="button" class="row danger" id="btnClearAll">
        <div class="row-left">
          <div class="row-icon danger">
            <svg viewBox="0 0 24 24"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </div>
          <div class="row-texts">
            <span class="row-title">Tüm Verileri Temizle</span>
            <span class="row-desc">Sohbetler, önbellek ve tüm değişiklikler silinir</span>
          </div>
        </div>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn btn-cancel" id="modalCancel">Vazgeç</button>
        <button type="button" class="modal-btn btn-danger" id="modalConfirm">Temizle</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script>
    (function () {
      var THEME_KEY = 'lumea-theme';
      var CHATS_KEY = 'lumea-chats';

      try {
        if (localStorage.getItem(THEME_KEY) === 'dark') document.body.setAttribute('data-theme', 'dark');
      } catch (e) {}

      function loadStats() {
        var sent = 0, received = 0, chatsCount = 0;
        try {
          var chats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]');
          if (Array.isArray(chats)) {
            chatsCount = chats.length;
            chats.forEach(function (chat) {
              if (chat && Array.isArray(chat.messages)) {
                chat.messages.forEach(function (msg) {
                  if (msg.role === 'user') sent++;
                  else if (msg.role === 'ai' || msg.role === 'assistant') received++;
                });
              }
            });
          }
        } catch (e) {}
        document.getElementById('statChats').textContent = chatsCount;
        document.getElementById('statSent').textContent = sent;
        document.getElementById('statReceived').textContent = received;
      }
      loadStats();

      var confirmModal = document.getElementById('confirmModal');
      var toastMsg = document.getElementById('toastMsg');

      function closeModal() { confirmModal.classList.remove('active'); }
      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(function () { toastMsg.classList.remove('show'); }, 2400);
      }

      var PREFIX = 'lumea-';
      var CHAT_PREFIX = 'lumea-chat';

      function removeKeys(test) {
        try {
          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && test(k)) keys.push(k);
          }
          keys.forEach(function (k) { localStorage.removeItem(k); });
        } catch (e) {}
      }
      function applyTheme() {
        try {
          if (localStorage.getItem(THEME_KEY) === 'dark') document.body.setAttribute('data-theme', 'dark');
          else document.body.removeAttribute('data-theme');
        } catch (e) {}
      }
      function clearCache() {
        try { sessionStorage.clear(); } catch (e) {}
        if (window.caches && caches.keys) {
          return caches.keys()
            .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
            .catch(function () {});
        }
        return Promise.resolve();
      }

      var ACTIONS = {
        chats: {
          title: 'Sohbet Verileri Silinsin mi?',
          desc: 'Kayıtlı sohbetleriniz ve mesaj istatistikleri sıfırlanacaktır. Bu işlem geri alınamaz.',
          toast: 'Sohbet verileri temizlendi.',
          run: function () {
            removeKeys(function (k) { return k.indexOf(CHAT_PREFIX) === 0; });
            return Promise.resolve();
          }
        },
        changes: {
          title: 'Değişiklikler Temizlensin mi?',
          desc: 'Ayarlarda ve diğer sayfalarda yaptığınız tema, renk, açma/kapama ve seçim değişiklikleri ilk haline döner. Sohbetleriniz silinmez.',
          toast: 'Değişiklikler temizlendi, ayarlar ilk haline döndü.',
          run: function () {
            removeKeys(function (k) { return k.indexOf(PREFIX) === 0 && k.indexOf(CHAT_PREFIX) !== 0; });
            return Promise.resolve();
          }
        },
        cache: {
          title: 'Önbellek Temizlensin mi?',
          desc: 'Geçici dosyalar ve oturum verileri silinir. Sohbetleriniz ve ayarlarınız korunur.',
          toast: 'Önbellek temizlendi.',
          run: clearCache
        },
        all: {
          title: 'Tüm Veriler Silinsin mi?',
          desc: 'Tüm sohbet verileri, önbellek ve ayarlarda yaptığınız değişiklikler silinecek. Bu işlem geri alınamaz.',
          toast: 'Tüm veriler temizlendi.',
          run: function () {
            removeKeys(function (k) { return k.indexOf(PREFIX) === 0; });
            return clearCache();
          }
        }
      };

      var current = null;
      function openModal(name) {
        current = ACTIONS[name];
        document.getElementById('modalTitle').textContent = current.title;
        document.getElementById('modalDesc').textContent = current.desc;
        confirmModal.classList.add('active');
      }

      document.getElementById('btnClearChats').addEventListener('click', function () { openModal('chats'); });
      document.getElementById('btnResetChanges').addEventListener('click', function () { openModal('changes'); });
      document.getElementById('btnClearCache').addEventListener('click', function () { openModal('cache'); });
      document.getElementById('btnClearAll').addEventListener('click', function () { openModal('all'); });
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      confirmModal.addEventListener('click', function (e) {
        if (e.target === confirmModal) closeModal();
      });

      document.getElementById('modalConfirm').addEventListener('click', function () {
        var action = current;
        closeModal();
        if (!action) return;
        action.run().then(function () {
          applyTheme();
          loadStats();
          showToast(action.toast);
        });
      });

      document.getElementById('btnBack').addEventListener('click', function () {
        window.location.href = 'ayarlar.html';
      });
    })();
  </script>
</body>
</html>
