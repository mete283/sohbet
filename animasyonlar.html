<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Animasyonlar · Lumea</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --text: #1c1c1e;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.06);
      --muted: #8e8e93;
      --active-bg: rgba(0, 0, 0, 0.04);
      --back-btn-bg: #ffffff;
      --accent: #007aff;
      --toggle-off: #e9e9ea;
    }
    [data-theme="dark"] {
      --bg: #0d0d10;
      --text: #f2f2f7;
      --card-bg: rgba(28, 28, 34, 0.75);
      --border: rgba(255, 255, 255, 0.07);
      --muted: #8e8e93;
      --active-bg: rgba(255, 255, 255, 0.06);
      --back-btn-bg: #2c2c32;
      --accent: #0a84ff;
      --toggle-off: #39393d;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 18px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -16px 0 2px;
      padding: 16px 0 10px;
      background: var(--bg);
    }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--back-btn-bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none;
      transition: transform 0.18s;
    }
    .back-btn:active { transform: scale(0.92); }
    .back-btn svg {
      width: 18px; height: 18px; stroke: var(--text); fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .section-label {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin: 2px 0 0 6px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      gap: 12px;
    }
    .row-texts { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .row-title { font-size: 15px; font-weight: 600; }
    .row-desc { font-size: 12px; color: var(--muted); line-height: 1.3; }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--toggle-off);
      transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border-radius: 28px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 22px; width: 22px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%;
      transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }
    .note {
      font-size: 12px; color: var(--muted); line-height: 1.45; padding: 0 6px;
    }
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--text); color: var(--bg);
      padding: 10px 18px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: all 0.28s; z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="title">Animasyonlar</div>
      <a href="ayarlar.html" class="back-btn" aria-label="Geri">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
      </a>
    </div>

    <div class="section-label">Açılış</div>
    <div class="card">
      <div class="row">
        <div class="row-texts">
          <span class="row-title">Giriş animasyonunu atla</span>
          <span class="row-desc" id="skipDesc">Kapalı: açılış animasyonu gösterir</span>
        </div>
        <label class="switch" aria-label="Giriş animasyonunu atla">
          <input type="checkbox" id="skipIntro">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <p class="note">Açıkken uygulama doğrudan sohbet ekranına geçer açılış animasyonu gösterilmez.</p>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      if (localStorage.getItem('lumea-theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
      }
      var KEY = 'lumea-skip-intro';
      var toggle = document.getElementById('skipIntro');
      var desc = document.getElementById('skipDesc');
      var toast = document.getElementById('toast');

      function sync() {
        var on = localStorage.getItem(KEY) === '1';
        toggle.checked = on;
        desc.textContent = on
          ? 'Açık: açılış animasyonu göstermez'
          : 'Kapalı: açılış animasyonu gösterir';
      }
      sync();

      toggle.addEventListener('change', function () {
        localStorage.setItem(KEY, toggle.checked ? '1' : '0');
        sync();
        toast.textContent = toggle.checked ? 'Animasyon atlanacak' : 'Animasyon oynatılacak';
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      });
    })();
  </script>
</body>
</html>
